# Render blueprint — deploys the Kryptos FastAPI backend as a Docker web service.
# The frontend is on Cloudflare Pages (static SPA); this backend serves /api/* and /health.
# The frontend's VITE_API_BASE_URL must point at this service's public URL.
services:
  - type: web
    name: kryptos-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: KRYPTOS_FRONTEND_DIST
        value: /app/frontend/dist
      - key: HF_HOME
        value: /tmp/hf_cache
      - key: KRYPTOS_CORS_ORIGINS
        value: https://kryptos.nitsuah.io,https://kryptos-k4.pages.dev,https://kryptos-k4.netlify.app
      # Optional: set DATABASE_URL to a Neon/Postgres connection string to enable
      # the dashboard DB features. Leave unset for db_enabled:false (graceful).
      # - key: DATABASE_URL
      #   sync: false
      # Schema: on boot the API applies db_schema.py (CREATE ... IF NOT EXISTS only)
      # when DATABASE_URL is set. Set KRYPTOS_DB_AUTO_MIGRATE=0 to opt out.
      # Log stream: requires KRYPTOS_LOG_TOKEN (browser: localStorage "kryptos.logToken").
      # KRYPTOS_LOG_STREAM_PUBLIC=redacted opts in to an anonymous redacted view.
      # - key: KRYPTOS_LOG_TOKEN
      #   generateValue: true
      # Required for attack runs, reindex, decrypt and vault routes: shared API token.
      # The dashboard reads it from localStorage "kryptos.apiToken". Optional tuning:
      # KRYPTOS_RATE_LIMIT_PER_MIN (default 60), KRYPTOS_MAX_ATTACK_JOBS (default 3).
      - key: KRYPTOS_API_TOKEN
        generateValue: true
      # Render's proxy appends the connecting client address to X-Forwarded-For; the
      # limiter reads the right-most entry (client-supplied entries sit to its left).
      - key: KRYPTOS_TRUST_PROXY
        value: "1"
      - key: KRYPTOS_LOG_TOKEN
        generateValue: true
      # Optional: LLM providers for the ops director. Falls back to rule-based
      # logic when unset.
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
