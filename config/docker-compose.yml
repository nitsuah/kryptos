services:
  kryptos:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kryptos-dev
    container_name: kryptos-dev
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: python -m kryptos.cli.main serve
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/tmp/hf_cache
    tty: true
