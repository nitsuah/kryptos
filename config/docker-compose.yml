services:
  kryptos:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kryptos-dev
    container_name: kryptos-dev
    volumes:
      - ..:/app
    working_dir: /app
    command: tail -f /dev/null
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/tmp/hf_cache
    tty: true
