name: CI (fast)

on:
  push:
    branches: [ main, autopilot/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f config/requirements-dev.txt ]; then pip install -r config/requirements-dev.txt; elif [ -f config/requirements.txt ]; then pip install -r config/requirements.txt; fi
          # install the package in editable mode so package imports resolve
          pip install -e .
      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm
      - name: Debug package structure
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Package location ==="
          python -c "import sys; print('\n'.join(sys.path))"
          echo "=== Installed packages ==="
          pip list | grep kryptos
          echo "=== Directory structure ==="
          ls -la src/kryptos/
          ls -la src/kryptos/agents/
          echo "=== Trying import ==="
          python -c "import kryptos; print('kryptos OK'); import kryptos.agents; print('kryptos.agents OK')"
      - name: Verify package installation
        run: |
          python -c "from kryptos.agents import OpsAgent, QAgent, SpyAgent; print('✓ Agents imported successfully')"
      - name: Run fast tests (skip slow Monte Carlo tests)
        run: pytest -m "not slow" -q

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install -e .
      - name: Run attack-sweep benchmarks
        run: kryptos benchmark --out-dir benchmarks
      - name: Publish benchmark summary
        run: |
          echo "## K4 attack-sweep benchmarks" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; from kryptos.benchmarks import format_results_table; print(format_results_table(json.load(open('benchmarks/results.json'))))" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results.json
            benchmarks/results.csv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
